name: 🧪 Test (Push)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'mcansh/wtf.rent'
    uses: ./.github/workflows/push.yml
    with:
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      node: '["24", "latest"]'
