name: 🧪 Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: ⚙️ Build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: 🟧 Install dependencies
        run: nub install

      - name: 🏗 Build
        run: nub run build

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⎔ Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: 🟧 Install dependencies
        run: nub install

      - name: 🎭 Install Playwright browsers
        run: nub exec playwright install --with-deps

      - name: 🧪 Run Tests
        run: nub run test
