services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wtf.rent
    ports:
      - "5432:5432"
    volumes:
      # - ./.cache/postgres:/var/lib/postgresql/data
      - ./.cache/postgres:/var/lib/postgresql/18/docker
